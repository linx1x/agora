# Hosted platform: main service is "web"; DB hostname is localhost (shared network in ECS).
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://postgres:secret@localhost:5432/agora
      # Set in your hosting platform's settings or .env (mark as secret):
      SESSION_SECRET: ${SESSION_SECRET}
      ACCESS_CODE: ${ACCESS_CODE}
      ICE_SERVERS: ${ICE_SERVERS}
      # Media through LiveKit (ADR-031); without LIVEKIT_URL media falls back to P2P
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      MEDIA_BACKEND: ${MEDIA_BACKEND:-}
      # Optional tuning (Plain):
      SPACE_CAPACITY: ${SPACE_CAPACITY:-50}
      FEATURE_FLAGS: ${FEATURE_FLAGS:-}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-365}
    volumes:
      # CRITICAL: app data (future chat file uploads, PLAN P4.5) - persistence S3 requise
      - ./data:/app/data
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: agora
